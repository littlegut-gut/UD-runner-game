<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height,GROUND_Y=H-60,BAND_TOP=Math.round(H*.7);
const PT=10;
const SPEED_BASE=5,SPEED_STEP=0.5,SPEED_EVERY=250,PX_PER_M=10,MAX_SPEED=16; // 上限16：可視0.81s仍大於反應時間
const AWARD_EVERY=500,SLIDE_TIME=32;   // 每500米獎勵關
const AWARD_COINS=true;   // true＝獎勵障礙上方一定有金幣

/* ============ 音效 ============ */
let AC=null;
function beep(f,d,type,vol,slide){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.value=f;
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+d);
    g.gain.value=vol||.2;
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}
const sJump=()=>beep(300,.15,'square',.15,600);
const sJump2=()=>beep(500,.12,'square',.15,900);
const sSlide=()=>beep(400,.12,'sawtooth',.12,150);
const sCoin=()=>{beep(900,.08,'sine',.2);setTimeout(()=>beep(1400,.12,'sine',.2),70);};
const sRare=()=>{beep(1100,.08,'sine',.22);setTimeout(()=>beep(1650,.14,'sine',.22),70);};
const sDead=()=>beep(220,.4,'sawtooth',.25,60);
const sAward=()=>[660,880,1100].forEach((f,i)=>setTimeout(()=>beep(f,.12,'triangle',.2),i*90));
const sCombo=n=>{const f=800+Math.min(n,12)*50;beep(f,.07,'sine',.2);setTimeout(()=>beep(f*1.5,.1,'sine',.2),60);};
const sItem=()=>[520,780,1040].forEach((f,i)=>setTimeout(()=>beep(f,.1,'triangle',.22),i*80));
const sShield=()=>beep(180,.25,'square',.25,90);

/* ============ BGM ============ */
let bgmOn=true,bgmTimer=null,bgmStarted=false;
const BPM=96,BEAT=60/BPM;
const LEAD=[
 [440,1],[523.25,1],[659.25,1],[587.33,1],
 [523.25,1],[440,1],[392,2],
 [349.23,1],[440,1],[523.25,1],[440,1],
 [392,1],[329.63,1],[293.66,2],
 [440,1],[523.25,1],[659.25,1],[880,1],
 [783.99,1],[659.25,1],[587.33,2],
 [523.25,1],[587.33,1],[659.25,1],[523.25,1],
 [440,1],[392,1],[440,2]
];
const BASS=[
 [110,4],[87.31,4],[130.81,4],[98,4],
 [110,4],[87.31,4],[130.81,4],[110,4]
];
function ensureAC(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
  }catch(e){}
}
function note(f,t,d,type,vol){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(AC.destination);
  o.start(t);o.stop(t+d);
}
function scheduleLoop(){
  ensureAC();if(!AC)return;
  const t0=AC.currentTime+.05;
  let t=t0;
  for(const [f,d] of LEAD){if(f)note(f,t,d*BEAT*.9,'square',.05);t+=d*BEAT;}
  let tb=t0;
  for(const [f,d] of BASS){note(f,tb,d*BEAT*.95,'triangle',.09);tb+=d*BEAT;}
  const len=LEAD.reduce((s,n)=>s+n[1],0)*BEAT;
  bgmTimer=setTimeout(scheduleLoop,(len-.15)*1000);
}
function startBGM(){if(!bgmStarted){bgmStarted=true;scheduleLoop();}}
function toggleBGM(){
  bgmOn=!bgmOn;
  if(bgmOn)startBGM();
  else{clearTimeout(bgmTimer);bgmStarted=false;}
  return bgmOn;
}

/* ============ 最高分 ============ */
let best=+localStorage.getItem('runner_best')||0,newRec=false;

/* ============ 手感包 ============ */
let parts=[],floats=[],shake=0,flash=0,squash=0;
function puff(x,y,n,col,spd,up){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,v=(spd||2)*(.4+Math.random()*.8);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(up||1),g:.15,r:2+Math.random()*3,col,life:1,dec:.03+Math.random()*.03});
  }
}
function spark(x,y,n,col){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,v=1+Math.random()*3;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.05,r:1.5+Math.random()*2,col,life:1,dec:.04+Math.random()*.03,star:true});
  }
}
function floatTxt(x,y,txt,col,big){floats.push({x,y,txt,col:col||'#fff',big,life:1});}
function updateFX(){
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life-=p.dec;}
  parts=parts.filter(p=>p.life>0);
  for(const f of floats){f.y-=1.2;f.life-=.02;}
  floats=floats.filter(f=>f.life>0);
  shake*=.86;if(shake<.3)shake=0;
  flash*=.85;if(flash<.02)flash=0;
  squash*=.8;if(Math.abs(squash)<.02)squash=0;
  comboFlash*=.85;if(comboFlash<.02)comboFlash=0;
}
function drawFX(){
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;
    if(p.star){
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.life*3);
      ctx.fillRect(-p.r,-1,p.r*2,2);ctx.fillRect(-1,-p.r,2,p.r*2);
      ctx.restore();
    }else{
      ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.5,p.r*p.life),0,7);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  for(const f of floats){
    ctx.globalAlpha=Math.max(0,f.life);
    ctx.fillStyle=f.col;
    ctx.font=(f.big?'bold 30px':'bold 20px')+' sans-serif';
    ctx.textAlign='center';
    ctx.fillText(f.txt,f.x,f.y);
    ctx.textAlign='left';
  }
  ctx.globalAlpha=1;
}

/* ============ PNG 載入 ============ */
function removeBG(data,w,h){
  const isBG=i=>{
    if(data[i+3]===0)return true;
    return data[i]>200&&data[i+1]>200&&data[i+2]>200;
  };
  const seen=new Uint8Array(w*h),stack=[];
  const push=(x,y)=>{const p=y*w+x;if(!seen[p]){seen[p]=1;stack.push(p);}};
  for(let x=0;x<w;x++){push(x,0);push(x,h-1);}
  for(let y=0;y<h;y++){push(0,y);push(w-1,y);}
  while(stack.length){
    const p=stack.pop(),i=p*4;
    if(!isBG(i))continue;
    data[i+3]=0;
    const x=p%w,y=(p/w)|0;
    if(x>0)push(x-1,y);if(x<w-1)push(x+1,y);
    if(y>0)push(x,y-1);if(y<h-1)push(x,y+1);
  }
}
function trimAlpha(c){
  const g=c.getContext('2d');
  const d=g.getImageData(0,0,c.width,c.height).data;
  let minX=c.width,minY=c.height,maxX=-1,maxY=-1;
  for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){
    if(d[(y*c.width+x)*4+3]>0){
      if(x<minX)minX=x;if(x>maxX)maxX=x;
      if(y<minY)minY=y;if(y>maxY)maxY=y;
    }
  }
  if(maxX<0)return c;
  const t=document.createElement('canvas');
  t.width=maxX-minX+1;t.height=maxY-minY+1;
  t.getContext('2d').drawImage(c,minX,minY,t.width,t.height,0,0,t.width,t.height);
  return t;
}
function keepMain(c){
  const g=c.getContext('2d');
  const d=g.getImageData(0,0,c.width,c.height);
  const a=d.data,w=c.width,h=c.height;
  const seen=new Uint8Array(w*h);
  const comps=[];let bestSize=0,bestStart=-1;
  for(let s=0;s<w*h;s++){
    if(seen[s]||a[s*4+3]===0)continue;
    const comp=[s];seen[s]=1;let head=0;
    while(head<comp.length){
      const p=comp[head++],x=p%w,y=(p/w)|0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        if(!dx&&!dy)continue;
        const nx=x+dx,ny=y+dy;
        if(nx<0||ny<0||nx>=w||ny>=h)continue;
        const q=ny*w+nx;
        if(!seen[q]&&a[q*4+3]>0){seen[q]=1;comp.push(q);}
      }
    }
    comps.push(comp);
    if(comp.length>bestSize){bestSize=comp.length;bestStart=comps.length-1;}
  }
  if(bestStart<0)return;
  const keep=new Uint8Array(w*h);
  for(const p of comps[bestStart])keep[p]=1;
  for(let p=0;p<w*h;p++)if(a[p*4+3]>0&&!keep[p])a[p*4+3]=0;
  g.putImageData(d,0,0);
}
function loadImg(src){
  const im=new Image();im.ok=false;im.tex=null;
  im.onerror=()=>console.log('❌ 載入失敗：'+src);
  im.onload=()=>{
    im.tex=im;
    try{
      const c=document.createElement('canvas');c.width=im.width;c.height=im.height;
      const g=c.getContext('2d');g.drawImage(im,0,0);
      const d=g.getImageData(0,0,c.width,c.height);
      removeBG(d.data,c.width,c.height);
      g.putImageData(d,0,0);
      im.tex=trimAlpha(c);
    }catch(e){}
    im.ok=true;
  };
  im.src=src;return im;
}
function loadSheet(src,n){
  const im=new Image();im.ok=false;im.frames=[];
  im.onerror=()=>console.log('❌ 載入失敗：'+src);
  im.onload=()=>{
    try{
      const w=im.width,h=im.height;
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const g=c.getContext('2d');g.drawImage(im,0,0);
      const d=g.getImageData(0,0,w,h);
      removeBG(d.data,w,h);
      for(let y=Math.floor(h*.8);y<h;y++){
        let cnt=0;
        for(let x=0;x<w;x++)if(d.data[(y*w+x)*4+3]>0)cnt++;
        if(cnt>w*.9)for(let x=0;x<w;x++)d.data[(y*w+x)*4+3]=0;
      }
      g.putImageData(d,0,0);
      const fw=Math.floor(w/n);
      const trims=[];
      for(let i=0;i<n;i++){
        const f=document.createElement('canvas');f.width=fw;f.height=h;
        f.getContext('2d').drawImage(c,i*fw,0,fw,h,0,0,fw,h);
        keepMain(f);
        trims.push(trimAlpha(f));
      }
      let mw=0,mh=0;
      for(const t of trims){mw=Math.max(mw,t.width);mh=Math.max(mh,t.height);}
      for(const t of trims){
        const nc=document.createElement('canvas');nc.width=mw;nc.height=mh;
        nc.getContext('2d').drawImage(t,Math.round((mw-t.width)/2),mh-t.height);
        im.frames.push(nc);
      }
    }catch(e){}
    im.ok=im.frames.length>0;
  };
  im.src=src;return im;
}

/* ============ 素材 PNG（選用） ============ */
const FLIP=false;
const RUN_ANIM=true;
const runSheet=loadSheet('player_sheet.png',4);
const runImgs=[loadImg('player_run1.png'),loadImg('player_run2.png')];
const jumpImg=loadImg('player_jump.png');
const slideImg=loadImg('player_slide.png');
const heartImgs=[
  Object.assign(loadImg('B_heart.png'),{val:1,rare:false}),
  Object.assign(loadImg('G_heart.png'),{val:1,rare:false}),
  Object.assign(loadImg('O_heart.png'),{val:1,rare:false}),
  Object.assign(loadImg('P_heart.png'),{val:1,rare:false}),
  Object.assign(loadImg('R_heart.png'),{val:3,rare:true}),
  Object.assign(loadImg('Y_heart.png'),{val:1,rare:false})
];
const trapImgs=[];for(let i=1;i<=8;i++)trapImgs.push(loadImg('Trap_'+i+'.png'));
const coinIcon=loadImg('Coin.png');
const awImgs=[loadImg('Award_1.png'),loadImg('Award_2.png')];

function drawSprite(){
  const p=player;
  const isSlide=slideTimer>0;
  let tex=null;
  if(!p.onGround&&jumpImg.ok)tex=jumpImg.tex;
  else if(isSlide&&slideImg.ok&&slideImg.tex)tex=slideImg.tex;   // 下滑圖優先
  else if(runSheet.ok&&runSheet.frames.length)
    tex=runSheet.frames[Math.floor(runPhase/5)%runSheet.frames.length];
  else{
    const ok=runImgs.filter(i=>i.ok);
    if(ok.length)tex=(RUN_ANIM?ok[Math.floor(runPhase/6)%ok.length]:ok[0]).tex;
  }
  if(!tex)return false;
  const airH=GROUND_Y-(p.y+p.h);
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath();ctx.ellipse(p.x+p.w/2,GROUND_Y+8,Math.max(10,26-airH*.12),5,0,0,7);ctx.fill();
  if(speed>8&&started&&!gameOver){
    ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;
    for(let i=0;i<3;i++){
      const yy=p.y+10+i*14;
      ctx.beginPath();ctx.moveTo(p.x-16-i*6,yy);ctx.lineTo(p.x-4-i*6,yy);ctx.stroke();
    }
  }
  const bounce=(p.onGround&&started&&!gameOver&&!isSlide)?-Math.abs(Math.sin(runPhase*Math.PI/6))*2.5:0;
  const usingSlide=(tex===slideImg.tex);
  const h=usingSlide?42:p.h+8,w=h*(tex.width/tex.height||.8);   // 下滑圖固定 42 高、不壓扁
  ctx.save();
  if(FLIP){ctx.translate(p.x+p.w/2,0);ctx.scale(-1,1);ctx.translate(-(p.x+p.w/2),0);}
  let sy=1-squash,sx=1+squash;
  if(isSlide&&!usingSlide){sy*=.55;sx*=1.3;}   // 沒有下滑圖時才用壓扁 fallback
  ctx.translate(p.x+p.w/2,p.y+p.h);ctx.scale(sx,sy);ctx.translate(-(p.x+p.w/2),-(p.y+p.h));
  const lean=Math.min(.1,(speed-SPEED_BASE)*.012);
  ctx.translate(p.x+p.w/2,p.y+p.h);ctx.rotate(lean);ctx.translate(-(p.x+p.w/2),-(p.y+p.h));
  ctx.drawImage(tex,p.x+p.w/2-w/2,p.y+p.h-h+bounce,w,h);
  ctx.restore();
  return true;
}

/* ============ 夜空城堡背景 ============ */
const stars=[];for(let i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*BAND_TOP*.9,s:1+Math.random()*2,ph:Math.random()*6.28});
function layerCanvas(w,fn){
  const c=document.createElement('canvas');c.width=w;c.height=H;
  fn(c.getContext('2d'));return c;
}
function tri(g,cx,by,w,h){g.beginPath();g.moveTo(cx-w,by);g.lineTo(cx,by-h);g.lineTo(cx+w,by);g.closePath();g.fill();}
function castle(g,x,by){
  const u=4;
  g.fillStyle='#3a4a56';g.fillRect(x-18*u,by-2*u,36*u,2*u);
  g.fillStyle='#8fa3b5';
  g.fillRect(x-10*u,by-16*u,20*u,14*u);
  g.fillRect(x-16*u,by-12*u,6*u,10*u);
  g.fillRect(x+10*u,by-12*u,6*u,10*u);
  g.fillRect(x-4*u,by-24*u,8*u,22*u);
  g.fillStyle='#35a8e8';
  tri(g,x-13*u,by-12*u,3.5*u,7*u);
  tri(g,x+13*u,by-12*u,3.5*u,7*u);
  tri(g,x,by-24*u,4.5*u,9*u);
  tri(g,x-9*u,by-16*u,2*u,4*u);
  tri(g,x+9*u,by-16*u,2*u,4*u);
  g.fillStyle='#16222c';
  g.fillRect(x-2*u,by-6*u,4*u,6*u);
  g.beginPath();g.arc(x,by-6*u,2*u,Math.PI,0);g.fill();
  g.fillRect(x-7*u,by-13*u,2*u,3*u);
  g.fillRect(x+5*u,by-13*u,2*u,3*u);
  g.fillRect(x-1*u,by-20*u,2*u,3*u);
}
function statue(g,x,by,s){
  g.fillRect(x-20*s,by-58*s,40*s,58*s);
  g.fillRect(x-25*s,by-66*s,50*s,10*s);
  g.beginPath();g.arc(x,by-66*s,15*s,Math.PI,0);g.fill();
  g.beginPath();g.moveTo(x-8*s,by-74*s);g.quadraticCurveTo(x-22*s,by-84*s,x-20*s,by-102*s);
  g.quadraticCurveTo(x-12*s,by-88*s,x-2*s,by-82*s);g.closePath();g.fill();
  g.beginPath();g.moveTo(x+8*s,by-74*s);g.quadraticCurveTo(x+22*s,by-84*s,x+20*s,by-102*s);
  g.quadraticCurveTo(x+12*s,by-88*s,x+2*s,by-82*s);g.closePath();g.fill();
}
function figure(g,x,by,s,t){
  g.save();g.translate(x,by);g.scale(s,s);
  if(t===0){g.fillRect(-4,-18,3,18);g.fillRect(2,-18,3,18);g.fillRect(-5,-38,10,20);
    g.fillRect(-8,-36,3,12);g.fillRect(5,-36,3,12);
    g.beginPath();g.arc(0,-43,6,0,7);g.fill();
    g.beginPath();g.ellipse(0,-48,13,3,0,0,7);g.fill();
    g.beginPath();g.moveTo(-7,-49);g.lineTo(7,-49);g.lineTo(4,-62);
    g.quadraticCurveTo(2,-68,-8,-71);g.quadraticCurveTo(-3,-62,-7,-49);g.closePath();g.fill();
  }else if(t===1){g.beginPath();g.arc(0,-11,11,Math.PI,0);g.fill();g.fillRect(-11,-11,22,11);
  }else if(t===2){g.fillRect(-4,-8,3,8);g.fillRect(1,-8,3,8);g.fillRect(-5,-20,10,12);
    g.beginPath();g.arc(0,-27,8,0,7);g.fill();g.fillRect(-1,-36,2,5);
    g.beginPath();g.arc(0,-37,2.5,0,7);g.fill();
  }else if(t===3){g.fillRect(-4,-8,3,8);g.fillRect(1,-8,3,8);g.fillRect(-4,-20,8,12);
    g.beginPath();g.arc(0,-28,9,0,7);g.fill();
    g.beginPath();g.moveTo(-9,-28);g.lineTo(-11,-20);g.lineTo(11,-20);g.lineTo(9,-28);g.closePath();g.fill();
  }else if(t===4){g.fillRect(-4,-8,3,8);g.fillRect(1,-8,3,8);g.fillRect(-5,-18,10,10);
    g.beginPath();g.arc(0,-25,7,0,7);g.fill();
  }else if(t===5){g.fillRect(-6,-12,5,12);g.fillRect(1,-12,5,12);g.fillRect(-8,-30,16,18);
    g.beginPath();g.arc(0,-38,9,0,7);g.fill();
    g.beginPath();g.moveTo(-6,-44);g.lineTo(-10,-57);g.lineTo(-1,-47);g.closePath();g.fill();
    g.beginPath();g.moveTo(6,-44);g.lineTo(10,-57);g.lineTo(1,-47);g.closePath();g.fill();
  }else if(t===6){g.fillRect(-5,-4,4,4);g.fillRect(1,-4,4,4);g.fillRect(-7,-11,14,8);
    g.beginPath();g.arc(0,-17,8,0,7);g.fill();
  }else{g.fillRect(-7,-16,5,16);g.fillRect(2,-16,5,16);g.fillRect(-9,-32,18,16);
    g.fillRect(-13,-32,4,14);g.fillRect(9,-32,4,14);g.fillRect(-7,-46,14,12);
    g.fillRect(-1,-52,2,6);g.beginPath();g.arc(0,-53,2.5,0,7);g.fill();}
  g.restore();
}
const farLayer=layerCanvas(1400,g=>{castle(g,700,BAND_TOP+8);});
const midLayer=layerCanvas(1400,g=>{
  g.fillStyle='#0a0e0f';
  statue(g,300,GROUND_Y,1);
  [[80,1.15,0],[200,1,1],[400,1,2],[480,1.05,3],[560,.95,4],
   [700,1.2,5],[860,.95,6],[1010,1.1,7],[1240,1,4]]
  .forEach(a=>figure(g,a[0],GROUND_Y,a[1],a[2]));
});
const groundLayer=layerCanvas(600,g=>{
  g.fillStyle='#162223';
  [[30,14],[140,26],[255,18],[370,30],[480,12],[560,24]].forEach(a=>g.fillRect(a[0],GROUND_Y+a[1],26,4));
});
function drawLayer(img,off){
  const w=img.width,x=-(off%w);
  ctx.drawImage(img,x,0);ctx.drawImage(img,x+w,0);
}

/* ============ 遊戲本體 ============ */
let player,obstacles,coins,speed,score,coinsGot,gameOver,started,spawnTimer,frame,farOff,midOff,groundOff,dist,nextAwardM,runPhase,lastStep,combo,comboMax,comboFlash;
let shield,magnetT,slideTimer,pendingSlide,jumps;
function reset(){
  player={x:120,y:GROUND_Y-50,w:40,h:50,vy:0,onGround:true};
  obstacles=[];coins=[];
  speed=SPEED_BASE;score=0;coinsGot=0;gameOver=false;started=false;spawnTimer=70;frame=0;
  farOff=0;midOff=0;groundOff=0;dist=0;nextAwardM=AWARD_EVERY;newRec=false;
  runPhase=0;lastStep=0;combo=0;comboMax=0;comboFlash=0;
  shield=false;magnetT=0;slideTimer=0;pendingSlide=false;jumps=0;
}
reset();

function endSlide(){
  if(slideTimer>0){slideTimer=0;if(player.onGround){player.h=50;player.y=GROUND_Y-50;}}
}
function jump(){
  if(gameOver){reset();started=true;return;}
  if(!started){started=true;if(bgmOn)startBGM();}
  endSlide();
  if(player.onGround){
    player.vy=-13;player.onGround=false;jumps=1;
    squash=-.35;puff(player.x+20,GROUND_Y,6,'#cfd8dc',2,1);sJump();
  }else if(jumps<2){   // 二段跳
    player.vy=-11;jumps=2;
    squash=-.3;spark(player.x+20,player.y+player.h,8,'#9fd4ff');sJump2();
  }
}
function slide(){
  if(!started||gameOver)return;
  if(player.onGround){
    if(slideTimer<=0){
      slideTimer=SLIDE_TIME;player.h=26;player.y=GROUND_Y-26;
      puff(player.x+20,GROUND_Y,6,'#cfd8dc',2,1);sSlide();
    }
  }else{player.vy=Math.max(player.vy,14);pendingSlide=true;}  // 空中→俯衝落地滑
}
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}
  if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();slide();}
  if(e.code==='KeyM')toggleBGM();
});
document.addEventListener('pointerdown',e=>{
  const r=canvas.getBoundingClientRect();
  const x=(e.clientX-r.left)*(W/r.width),y=(e.clientY-r.top)*(H/r.height);
  if(x>=0&&x<=W&&y>=0&&y<50&&x>W-60){toggleBGM();return;}
  if(!e.isPrimary){slide();return;}   // 第二根手指＝下滑
  jump();
});

function spawn(){
  let ox=W+50,ow=57,oh=57;
  /* 獎勵關：每500米；500m→2金幣、1000m→3金幣；Award放大40%；不混道具 */
  if(dist/PX_PER_M>=nextAwardM){
    const m=nextAwardM;
    nextAwardM=dist/PX_PER_M+AWARD_EVERY+Math.random()*100;
    const aw=Math.round(57*1.4);
    const okAw=awImgs.filter(i=>i.ok&&i.tex);
    if(okAw.length){
      const t=okAw[(Math.random()*okAw.length)|0];
      obstacles.push({type:'trap',img:t,x:ox,y:GROUND_Y-aw,w:aw,h:aw});
    }else{
      /* 沒圖也照出獎勵障礙（木箱外觀），金幣不缺席 */
      obstacles.push({type:'box',x:ox,y:GROUND_Y-aw,w:aw,h:aw});
    }
    if(AWARD_COINS){
      const n=(Math.round(m/500)%2===0)?3:2;   // 500m→2顆、1000m→3顆
      const base=110+Math.random()*40,gap=30+Math.random()*10;
      for(let k=0;k<n;k++)
        coins.push({x:ox+aw/2+(k-(n-1)/2)*gap,y:GROUND_Y-(n===3&&k===1?base+25:base),
          r:10+Math.random()*5,taken:false,val:1,rare:false,img:null,coin:true});
    }
    sAward();
    return;
  }

  }
  /* 飛行蝙蝠（只能滑） */
  if(Math.random()<.22){
    obstacles.push({type:'bat',x:W+50,y:GROUND_Y-62,w:90,h:130,
      bats:[{dx:10,dy:0},{dx:44,dy:-45},{dx:2,dy:-90}]});
    return;
  }
  /* 一般障礙 */
  const okTraps=trapImgs.filter(t=>t.ok&&t.tex);
  if(okTraps.length){
    const t=okTraps[(Math.random()*okTraps.length)|0];
    obstacles.push({type:'trap',img:t,x:ox,y:GROUND_Y-oh,w:ow,h:oh});
  }else if(Math.random()<.5){
    ow=40;oh=40;
    obstacles.push({type:'box',x:ox,y:GROUND_Y-oh,w:ow,h:oh});
  }else{
    ow=45;oh=30;
    obstacles.push({type:'spike',x:ox,y:GROUND_Y-oh,w:ow,h:oh});
  }
  /* 障礙上方「只有一種」 pickup：心70% / 護盾15% / 磁鐵15% */
  const px=ox+ow/2+(Math.random()*60-30),py=GROUND_Y-(100+Math.random()*60);
  const roll=Math.random();
  if(roll<.15){
    coins.push({x:px,y:py,r:14,taken:false,val:0,rare:false,img:null,kind:'item',itemType:'shield'});
  }else if(roll<.30){
    coins.push({x:px,y:py,r:14,taken:false,val:0,rare:false,img:null,kind:'item',itemType:'magnet'});
  }else{
    const c={x:px,y:py,r:10+Math.random()*5,taken:false,val:1,rare:false,img:null};
    const okH=heartImgs.filter(i=>i.ok&&i.tex);
    if(okH.length){
      const t=okH[(Math.random()*okH.length)|0];
      c.img=t;c.val=t.val;c.rare=t.rare;
    }
    coins.push(c);
  }
}

function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function circleRectHit(c,r){
  const cx=Math.max(r.x,Math.min(c.x,r.x+r.w)),cy=Math.max(r.y,Math.min(c.y,r.y+r.h));
  return (c.x-cx)**2+(c.y-cy)**2<c.r*c.r;
}

function update(){
  frame++;
  updateFX();
  const sp=(started&&!gameOver)?speed:1.2;
  farOff+=sp*.1;midOff+=sp*.5;groundOff+=sp;
  if(!started||gameOver)return;
  dist+=speed;
  speed=Math.min(MAX_SPEED,SPEED_BASE+Math.floor(dist/(SPEED_EVERY*PX_PER_M))*SPEED_STEP);
  score+=speed*0.02;
  if(player.onGround)runPhase+=speed*.15;
  const stepIdx=Math.floor(runPhase/6)%2;
  if(stepIdx!==lastStep){
    lastStep=stepIdx;
    puff(player.x+8,GROUND_Y,2,'#8fa3a8',1.5,.5);
  }
  const wasGround=player.onGround;
  player.vy+=.7;player.y+=player.vy;
  if(player.y+player.h>=GROUND_Y){player.y=GROUND_Y-player.h;player.vy=0;player.onGround=true;}
  if(!wasGround&&player.onGround){
    jumps=0;
    puff(player.x+20,GROUND_Y,8,'#cfd8dc',2.5,1);
    squash=.35;
    if(pendingSlide){pendingSlide=false;slideTimer=SLIDE_TIME;player.h=26;player.y=GROUND_Y-26;}
  }
  if(slideTimer>0){
    slideTimer--;
    if(frame%4===0)puff(player.x+6,GROUND_Y,2,'#9fb3b8',1.5,.5);
    if(slideTimer===0&&player.onGround){player.h=50;player.y=GROUND_Y-50;}
  }
  if(--spawnTimer<=0){
    spawn();
    spawnTimer=55+Math.random()*45;
  }
  for(const o of obstacles)o.x-=speed;
  obstacles=obstacles.filter(o=>o.x+o.w>-60);
  for(const c of coins)c.x-=speed;
  /* 磁鐵：心與道具自動飛來 */
  if(magnetT>0){
    magnetT--;
    for(const c of coins)if(!c.taken){c.x+=(player.x+20-c.x)*.1;c.y+=(player.y+10-c.y)*.1;}
  }
  let missed=false;
  for(const c of coins)if(!c.taken&&c.kind!=='item'&&c.x+c.r<0)missed=true;
  if(missed&&combo>0){combo=0;floatTxt(player.x+20,player.y-30,'COMBO LOST','#9fb3b8',false);}
  coins=coins.filter(c=>!c.taken&&c.x>-60);
  const hb={x:player.x+6,y:player.y+4,w:player.w-12,h:player.h-8};
  for(const o of obstacles){
    const rects=[];
    if(o.type==='bat'){
      for(const bt of o.bats)rects.push({x:o.x+bt.dx+5,y:o.y+bt.dy+3,w:36,h:28});
    }else if(o.type==='trap'){
      rects.push({x:o.x+5,y:o.y+4,w:o.w-10,h:o.h-4});
    }else rects.push(o);
    for(const b of rects){
      if(rectHit(hb,b)&&!gameOver){
        if(shield){
          shield=false;o.x=-999;
          spark(player.x+20,player.y+20,14,'#7fd4ff');
          floatTxt(player.x+20,player.y-30,'🛡 BREAK!','#7fd4ff',true);
          shake=8;sShield();
        }else{
          gameOver=true;
          if(Math.floor(score)>best){best=Math.floor(score);localStorage.setItem('runner_best',best);newRec=true;}
          puff(player.x+20,player.y+25,26,'#ff7755',4,2);
          spark(player.x+20,player.y+25,14,'#ffd76a');
          shake=14;flash=1;
          try{navigator.vibrate&&navigator.vibrate(200);}catch(e){}
          sDead();
        }
      }
    }
  }
  for(const c of coins)if(circleRectHit(c,hb)){
    c.taken=true;
    if(c.kind==='item'){
      if(c.itemType==='shield'){shield=true;floatTxt(c.x,c.y-20,'🛡 GET!','#7fd4ff',true);}
      else{magnetT=300;floatTxt(c.x,c.y-20,'🧲 GET!','#ff9ff3',true);}
      spark(c.x,c.y,14,'#9fd4ff');
      sItem();
      continue;
    }
    coinsGot+=c.val;
    combo++;comboMax=Math.max(comboMax,combo);comboFlash=1;
    const mult=1+Math.min(4,Math.floor(combo/5));
    score+=c.val*PT*mult;
    spark(c.x,c.y,c.rare?16:10,c.rare?'#ffd76a':'#ff88aa');
    floatTxt(c.x,c.y-18,'+'+c.val,c.rare?'#ffd76a':'#fff',c.rare);
    if(combo%5===0)floatTxt(player.x+20,player.y-34,'COMBO x'+mult+'!','#ffaa33',true);
    c.rare?sRare():sCombo(combo);
  }
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawGold(c){
  ctx.save();ctx.shadowColor='#ffd76a';ctx.shadowBlur=12;
  ctx.fillStyle='#ffcf3f';ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.strokeStyle='#d9a416';ctx.lineWidth=3;ctx.stroke();ctx.restore();
}
function drawBat(o){
  for(let i=0;i<o.bats.length;i++){
    const bt=o.bats[i];
    const flap=Math.sin(frame*.4+i*2.1+o.x*.05)*8;
    const cx=o.x+bt.dx+23,cy=o.y+bt.dy+15;
    ctx.fillStyle='#17a2ae';   // 青翅膀
    ctx.beginPath();ctx.moveTo(cx-6,cy);ctx.quadraticCurveTo(cx-26,cy-10-flap,cx-30,cy+4-flap);
    ctx.quadraticCurveTo(cx-18,cy+6,cx-6,cy+6);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(cx+6,cy);ctx.quadraticCurveTo(cx+26,cy-10-flap,cx+30,cy+4-flap);
    ctx.quadraticCurveTo(cx+18,cy+6,cx+6,cy+6);ctx.closePath();ctx.fill();
    ctx.fillStyle='#2ec4c6';   // 青身體
    ctx.beginPath();ctx.ellipse(cx,cy,8,10,0,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(cx-6,cy-8);ctx.lineTo(cx-9,cy-16);ctx.lineTo(cx-2,cy-10);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(cx+6,cy-8);ctx.lineTo(cx+9,cy-16);ctx.lineTo(cx+2,cy-10);ctx.closePath();ctx.fill();
    ctx.fillStyle='#083a3d';
    ctx.beginPath();ctx.arc(cx-3,cy-3,1.8,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(cx+3,cy-3,1.8,0,7);ctx.fill();
  }
}
function drawPlayer(){
  const p=player;
  const bounce=(p.onGround&&started&&!gameOver)?-Math.abs(Math.sin(runPhase*Math.PI/6))*2.5:0;
  const x=p.x,y=p.y+bounce,leg=Math.sin(runPhase)*8;
  const airH=GROUND_Y-(p.y+p.h);
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath();ctx.ellipse(p.x+p.w/2,GROUND_Y+8,Math.max(10,26-airH*.12),5,0,0,7);ctx.fill();
  ctx.save();
  let sy=1-squash,sx=1+squash;
  if(slideTimer>0){sy*=.55;sx*=1.3;}
  ctx.translate(p.x+p.w/2,p.y+p.h);ctx.scale(sx,sy);ctx.translate(-(p.x+p.w/2),-(p.y+p.h));
  ctx.strokeStyle='#c62828';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x+14,y+p.h-6);ctx.lineTo(x+14+leg,y+p.h+2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+26,y+p.h-6);ctx.lineTo(x+26-leg,y+p.h+2);ctx.stroke();
  ctx.strokeStyle='#e53935';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(x+10,y+20);ctx.lineTo(x+6,y+30);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+30,y+20);ctx.lineTo(x+34,y+30);ctx.stroke();
  ctx.fillStyle='#e53935';rr(x+4,y+16,32,26,8);ctx.fill();
  ctx.fillStyle='#ffd54f';ctx.fillRect(x+4,y+25,32,5);
  ctx.fillStyle='#ffe0c2';ctx.beginPath();ctx.arc(x+20,y+10,12,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#333';
  ctx.beginPath();ctx.arc(x+23,y+8,1.8,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+28,y+8,1.8,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function overlay(t1,t2){
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='bold 42px sans-serif';ctx.fillText(t1,W/2,H/2-24);
  ctx.font='20px sans-serif';ctx.fillText(t2,W/2,H/2+22);
  ctx.textAlign='left';
}

function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

  ctx.fillStyle='#04060c';ctx.fillRect(0,0,W,BAND_TOP);
  const bands=['#2a1826','#1e2d2d','#205052','#2a6b6d'];
  for(let i=0;i<4;i++){
    ctx.fillStyle=bands[i];
    ctx.fillRect(0,BAND_TOP+(GROUND_Y-BAND_TOP)*i/4,W,(GROUND_Y-BAND_TOP)/4+1);
  }
  for(const st of stars){
    const tw=.5+.5*Math.sin(frame*.06+st.ph);
    ctx.globalAlpha=.3+.7*tw;
    ctx.fillStyle='#5bc6ff';
    ctx.fillRect(st.x-st.s*2,st.y,st.s*4,1);
    ctx.fillRect(st.x,st.y-st.s*2,1,st.s*4);
    ctx.fillRect(st.x-1,st.y-st.s,3,st.s*2);
    ctx.fillRect(st.x-st.s,st.y-1,st.s*2,3);
    ctx.globalAlpha=1;
  }
  drawLayer(farLayer,farOff);
  drawLayer(midLayer,midOff);
  ctx.fillStyle='#050808';ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
  drawLayer(groundLayer,groundOff);

  for(const o of obstacles){
    if(o.type==='trap'&&o.img.ok&&o.img.tex){
      const tex=o.img.tex;
      const h=o.h+6,w=h*(tex.width/tex.height||1);
      ctx.drawImage(tex,o.x+o.w/2-w/2,o.y+o.h-h,w,h);
    }else if(o.type==='bat'){
      drawBat(o);
    }else if(o.type==='box'){
      ctx.fillStyle='#a56a3a';rr(o.x,o.y,o.w,o.h,6);ctx.fill();
      ctx.strokeStyle='#6b3f1d';ctx.lineWidth=3;ctx.stroke();
    }else{
      ctx.fillStyle='#e04444';
      for(let i=0;i<3;i++){
        const sx=o.x+i*15;
        ctx.beginPath();ctx.moveTo(sx,o.y+o.h);ctx.lineTo(sx+7.5,o.y);ctx.lineTo(sx+15,o.y+o.h);ctx.closePath();ctx.fill();
      }
    }
  }
  for(const c of coins){
    if(c.kind==='item'){
      const pul=1+Math.sin(frame*.2)*.15;
      ctx.font=Math.round(30*pul)+'px sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(c.itemType==='shield'?'🛡':'🧲',c.x,c.y);
      ctx.textAlign='left';
    }else if(c.coin){
      if(coinIcon.ok&&coinIcon.tex){
        const tex=coinIcon.tex,s=c.r*2.2,w=s*(tex.width/tex.height||1);
        ctx.drawImage(tex,c.x-w/2,c.y-s/2,w,s);
      }else drawGold(c);
    }else if(c.img&&c.img.ok&&c.img.tex){
      const tex=c.img.tex;
      const freq=c.rare?.5:.15,amp=c.rare?.18:.08;
      const s=c.r*2.3*(1+Math.sin(frame*freq+c.x*.05)*amp);
      const w=s*(tex.width/tex.height||1);
      ctx.drawImage(tex,c.x-w/2,c.y-s/2,w,s);
    }else drawGold(c);
  }
  if(!drawSprite())drawPlayer();
  /* 護盾泡泡／磁鐵標示 */
  if(shield){
    ctx.strokeStyle='rgba(127,212,255,.75)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(player.x+20,player.y+player.h/2,36+Math.sin(frame*.2)*3,0,7);ctx.stroke();
  }
  if(magnetT>0){
    ctx.font='20px sans-serif';ctx.textAlign='center';
    ctx.fillText('🧲',player.x+20,player.y-16);
    ctx.textAlign='left';
  }
  drawFX();
  ctx.restore();

  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash.toFixed(3)+')';ctx.fillRect(0,0,W,H);}

  /* 分數面板（自動寬度） */
  const icon=(coinIcon.ok&&coinIcon.tex)?coinIcon:heartImgs.find(i=>i.ok&&i.tex);
  ctx.font='bold 22px sans-serif';ctx.textBaseline='middle';
  const sTxt='Score: '+Math.floor(score);
  const cTxt=icon?('× '+coinsGot):('Coins: '+coinsGot);
  const bTxt='Best: '+best;
  const w1=ctx.measureText(sTxt).width;
  const w3=ctx.measureText(cTxt).width;
  const w4=ctx.measureText(bTxt).width;
  const iw=icon?24*(icon.tex.width/icon.tex.height||1):0;
  const x2=30+w1+18,x3=x2+iw+6,x4=x3+w3+18;
  ctx.fillStyle='rgba(255,255,255,.75)';rr(15,15,x4+w4,44,10);ctx.fill();
  ctx.fillStyle='#222';
  ctx.fillText(sTxt,30,38);
  if(icon)ctx.drawImage(icon.tex,x2,26,iw,24);
  ctx.fillText(cTxt,x3,38);
  ctx.fillText(bTxt,x4,38);
  ctx.font='22px sans-serif';
  ctx.fillText(bgmOn?'🔊':'',W-42,30);

  if(combo>=2){
    const pulse=1+comboFlash*.4;
    ctx.font='bold '+Math.round(26*pulse)+'px sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#ffaa33';
    const mult=1+Math.min(4,Math.floor(combo/5));
    ctx.fillText('COMBO ×'+combo+(mult>1?'  (x'+mult+')':''),W/2,72);
    ctx.textAlign='left';
  }

  if(!started)overlay('🏃 Undet Bu-Dou Tale','跳：空白/↑/點畫面｜滑：↓/S/雙指｜二段跳可｜M 音樂');
  else if(gameOver)overlay('💥 遊戲結束',
    (newRec?'🎉 新紀錄！ ':'')+`分數 ${Math.floor(score)}｜紅心 ${coinsGot}｜最大連擊 ${comboMax}｜最高 ${best} — 點擊重新開始`);
}
(function loop(){update();draw();requestAnimationFrame(loop);})();
</script>
