/* ============ 音效 ============ */
let AC=null;
function beep(f,d,type,vol,slide){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.value=f;
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+d);
    g.gain.value=vol||.2;
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}
const sJump=()=>beep(300,.15,'square',.15,600);
const sJump2=()=>beep(500,.12,'square',.15,900);
const sSlide=()=>beep(400,.12,'sawtooth',.12,150);
const sCoin=()=>{beep(900,.08,'sine',.2);setTimeout(()=>beep(1400,.12,'sine',.2),70);};
const sRare=()=>{beep(1100,.08,'sine',.22);setTimeout(()=>beep(1650,.14,'sine',.22),70);};
const sDead=()=>beep(220,.4,'sawtooth',.25,60);
const sAward=()=>[660,880,1100].forEach((f,i)=>setTimeout(()=>beep(f,.12,'triangle',.2),i*90));
const sCombo=n=>{const f=800+Math.min(n,12)*50;beep(f,.07,'sine',.2);setTimeout(()=>beep(f*1.5,.1,'sine',.2),60);};
const sItem=()=>[520,780,1040].forEach((f,i)=>setTimeout(()=>beep(f,.1,'triangle',.22),i*80));

/* ============ BGM：bgm.mp3 優先，缺檔回原創合成 ============ */
let bgmOn=true,bgmTimer=null,bgmStarted=false;
const bgmAudio=new Audio('bgm.mp3');
bgmAudio.loop=true;bgmAudio.volume=.35;
const BPM=96,BEAT=60/BPM;
const LEAD=[
 [440,1],[523.25,1],[659.25,1],[587.33,1],
 [523.25,1],[440,1],[392,2],
 [349.23,1],[440,1],[523.25,1],[440,1],
 [392,1],[329.63,1],[293.66,2],
 [440,1],[523.25,1],[659.25,1],[880,1],
 [783.99,1],[659.25,1],[587.33,2],
 [523.25,1],[587.33,1],[659.25,1],[523.25,1],
 [440,1],[392,1],[440,2]
];
const BASS=[
 [110,4],[87.31,4],[130.81,4],[98,4],
 [110,4],[87.31,4],[130.81,4],[110,4]
];
function ensureAC(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
  }catch(e){}
}
function note(f,t,d,type,vol){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(AC.destination);
  o.start(t);o.stop(t+d);
}
function scheduleLoop(){
  ensureAC();if(!AC)return;
  const t0=AC.currentTime+.05;
  let t=t0;
  for(const [f,d] of LEAD){if(f)note(f,t,d*BEAT*.9,'square',.05);t+=d*BEAT;}
  let tb=t0;
  for(const [f,d] of BASS){note(f,tb,d*BEAT*.95,'triangle',.09);tb+=d*BEAT;}
  const len=LEAD.reduce((s,n)=>s+n[1],0)*BEAT;
  bgmTimer=setTimeout(scheduleLoop,(len-.15)*1000);
}
function startBGM(){
  if(bgmStarted)return;
  bgmStarted=true;
  if(bgmAudio.readyState>=2)bgmAudio.play().catch(()=>scheduleLoop());
  else scheduleLoop();
}
function toggleBGM(){
  bgmOn=!bgmOn;
  if(bgmOn)startBGM();
  else{bgmAudio.pause();clearTimeout(bgmTimer);bgmStarted=false;}
  return bgmOn;
}

/* ============ 手感包 ============ */
let parts=[],floats=[],shake=0,flash=0,squash=0;
function puff(x,y,n,col,spd,up){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,v=(spd||2)*(.4+Math.random()*.8);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(up||1),g:.15,r:2+Math.random()*3,col,life:1,dec:.03+Math.random()*.03});
  }
}
function spark(x,y,n,col){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,v=1+Math.random()*3;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.05,r:1.5+Math.random()*2,col,life:1,dec:.04+Math.random()*.03,star:true});
  }
}
function floatTxt(x,y,txt,col,big){floats.push({x,y,txt,col:col||'#fff',big,life:1});}
function updateFX(){
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life-=p.dec;}
  parts=parts.filter(p=>p.life>0);
  for(const f of floats){f.y-=1.2;f.life-=.02;}
  floats=floats.filter(f=>f.life>0);
  shake*=.86;if(shake<.3)shake=0;
  flash*=.85;if(flash<.02)flash=0;
  squash*=.8;if(Math.abs(squash)<.02)squash=0;
  comboFlash*=.85;if(comboFlash<.02)comboFlash=0;
}
function drawFX(){
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;
    if(p.star){
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.life*3);
      ctx.fillRect(-p.r,-1,p.r*2,2);ctx.fillRect(-1,-p.r,2,p.r*2);
      ctx.restore();
    }else{
      ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.5,p.r*p.life),0,7);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  for(const f of floats){
    ctx.globalAlpha=Math.max(0,f.life);
    ctx.fillStyle=f.col;
    ctx.font=(f.big?'bold 30px':'bold 20px')+' sans-serif';
    ctx.textAlign='center';
    ctx.fillText(f.txt,f.x,f.y);
    ctx.textAlign='left';
  }
  ctx.globalAlpha=1;
}

/* ============ PNG 載入 ============ */
function removeBG(data,w,h){
  const isBG=i=>{
    if(data[i+3]===0)return true;
    return data[i]>200&&data[i+1]>200&&data[i+2]>200;
  };
  const seen=new Uint8Array(w*h),stack=[];
  const push=(x,y)=>{const p=y*w+x;if(!seen[p]){seen[p]=1;stack.push(p);}};
  for(let x=0;x<w;x++){push(x,0);push(x,h-1);}
  for(let y=0;y<h;y++){push(0,y);push(w-1,y);}
  while(stack.length){
    const p=stack.pop(),i=p*4;
    if(!isBG(i))continue;
    data[i+3]=0;
    const x=p%w,y=(p/w)|0;
    if(x>0)push(x-1,y);if(x<w-1)push(x+1,y);
    if(y>0)push(x,y-1);if(y<h-1)push(x,y+1);
  }
}
function trimAlpha(c){
  const g=c.getContext('2d');
  const d=g.getImageData(0,0,c.width,c.height).data;
  let minX=c.width,minY=c.height,maxX=-1,maxY=-1;
  for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){
    if(d[(y*c.width+x)*4+3]>0){
      if(x<minX)minX=x;if(x>maxX)maxX=x;
      if(y<minY)minY=y;if(y>maxY)maxY=y;
    }
  }
  if(maxX<0)return c;
  const t=document.createElement('canvas');
  t.width=maxX-minX+1;t.height=maxY-minY+1;
  t.getContext('2d').drawImage(c,minX,minY,t.width,t.height,0,0,t.width,t.height);
  return t;
}
function keepMain(c){
  const g=c.getContext('2d');
  const d=g.getImageData(0,0,c.width,c.height);
  const a=d.data,w=c.width,h=c.height;
  const seen=new Uint8Array(w*h);
  const comps=[];let bestSize=0,bestStart=-1;
  for(let s=0;s<w*h;s++){
    if(seen[s]||a[s*4+3]===0)continue;
    const comp=[s];seen[s]=1;let head=0;
    while(head<comp.length){
      const p=comp[head++],x=p%w,y=(p/w)|0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        if(!dx&&!dy)continue;
        const nx=x+dx,ny=y+dy;
        if(nx<0||ny<0||nx>=w||ny>=h)continue;
        const q=ny*w+nx;
        if(!seen[q]&&a[q*4+3]>0){seen[q]=1;comp.push(q);}
      }
    }
    comps.push(comp);
    if(comp.length>bestSize){bestSize=comp.length;bestStart=comps.length-1;}
  }
  if(bestStart<0)return;
  const keep=new Uint8Array(w*h);
  for(const p of comps[bestStart])keep[p]=1;
  for(let p=0;p<w*h;p++)if(a[p*4+3]>0&&!keep[p])a[p*4+3]=0;
  g.putImageData(d,0,0);
}
function loadImg(src){
  const im=new Image();im.ok=false;im.tex=null;
  im.onerror=()=>console.log('❌ 載入失敗：'+src);
  im.onload=()=>{
    im.tex=im;
    try{
      const c=document.createElement('canvas');c.width=im.width;c.height=im.height;
      const g=c.getContext('2d');g.drawImage(im,0,0);
      const d=g.getImageData(0,0,c.width,c.height);
      removeBG(d.data,c.width,c.height);
      g.putImageData(d,0,0);
      im.tex=trimAlpha(c);
    }catch(e){}
    im.ok=true;
  };
  im.src=src;return im;
}
function loadSheet(src,n){
  const im=new Image();im.ok=false;im.frames=[];
  im.onerror=()=>console.log('❌ 載入失敗：'+src);
  im.onload=()=>{
    try{
      const w=im.width,h=im.height;
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const g=c.getContext('2d');g.drawImage(im,0,0);
      const d=g.getImageData(0,0,w,h);
      removeBG(d.data,w,h);
      for(let y=Math.floor(h*.8);y<h;y++){
        let cnt=0;
        for(let x=0;x<w;x++)if(d.data[(y*w+x)*4+3]>0)cnt++;
        if(cnt>w*.9)for(let x=0;x<w;x++)d.data[(y*w+x)*4+3]=0;
      }
      g.putImageData(d,0,0);
      const fw=Math.floor(w/n);
      const trims=[];
      for(let i=0;i<n;i++){
        const f=document.createElement('canvas');f.width=fw;f.height=h;
        f.getContext('2d').drawImage(c,i*fw,0,fw,h,0,0,fw,h);
        keepMain(f);
        trims.push(trimAlpha(f));
      }
      let mw=0,mh=0;
      for(const t of trims){mw=Math.max(mw,t.width);mh=Math.max(mh,t.height);}
      for(const t of trims){
        const nc=document.createElement('canvas');nc.width=mw;nc.height=mh;
        nc.getContext('2d').drawImage(t,Math.round((mw-t.width)/2),mh-t.height);
        im.frames.push(nc);
      }
    }catch(e){}
    im.ok=im.frames.length>0;
  };
  im.src=src;return im;
}

/* ============ 素材 PNG（選用） ============ */
const FLIP=false;
const RUN_ANIM=true;
const runSheet=loadSheet('player_sheet.png',4);
const runImgs=[loadImg('player_run1.png'),loadImg('player_run2.png')];
const jumpImg=loadImg('player_jump.png');
const slideImg=loadImg('player_slide.png');
const heartImgs=[
  Object.assign(loadImg('B_heart.png'),{val:1,rare:false}),
  Object.assign(loadImg('G_heart.png'),{val:1,rare:false}),
  Object.assign(loadImg('O_heart.png'),{val:1,rare:false}),

  Object.assign(loadImg('R_heart.png'),{val:3,rare:true}),
  Object.assign(loadImg('Y_heart.png'),{val:1,rare:false})
];
const trapImgs=[];for(let i=1;i<=8;i++)trapImgs.push(loadImg('Trap_'+i+'.png'));
const coinIcon=loadImg('Coin.png');
const awImgs=[loadImg('Award_1.png'),loadImg('Award_2.png')];

function drawSprite(){
  const p=player;
  const isSlide=slideTimer>0;
  let tex=null;
  if(!p.onGround&&jumpImg.ok)tex=jumpImg.tex;
  else if(isSlide&&slideImg.ok&&slideImg.tex)tex=slideImg.tex;
  else if(runSheet.ok&&runSheet.frames.length)
    tex=runSheet.frames[Math.floor(runPhase/5)%runSheet.frames.length];
  else{
    const ok=runImgs.filter(i=>i.ok);
    if(ok.length)tex=(RUN_ANIM?ok[Math.floor(runPhase/6)%ok.length]:ok[0]).tex;
  }
  if(!tex)return false;
  const airH=GROUND_Y-(p.y+p.h);
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath();ctx.ellipse(p.x+p.w/2,GROUND_Y+8,Math.max(10,26-airH*.12),5,0,0,7);ctx.fill();
  if(speed>8&&started&&!gameOver){
    ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;
    for(let i=0;i<3;i++){
      const yy=p.y+10+i*14;
      ctx.beginPath();ctx.moveTo(p.x-16-i*6,yy);ctx.lineTo(p.x-4-i*6,yy);ctx.stroke();
    }
  }
  const bounce=(p.onGround&&started&&!gameOver&&!isSlide)?-Math.abs(Math.sin(runPhase*Math.PI/6))*2.5:0;
  const usingSlide=(tex===slideImg.tex);
  const h=usingSlide?42:p.h+8,w=h*(tex.width/tex.height||.8);
  ctx.save();
  if(FLIP){ctx.translate(p.x+p.w/2,0);ctx.scale(-1,1);ctx.translate(-(p.x+p.w/2),0);}
  let sy=1-squash,sx=1+squash;
  if(isSlide&&!usingSlide){sy*=.55;sx*=1.3;}
  ctx.translate(p.x+p.w/2,p.y+p.h);ctx.scale(sx,sy);ctx.translate(-(p.x+p.w/2),-(p.y+p.h));
  const lean=Math.min(.1,(speed-SPEED_BASE)*.012);
  ctx.translate(p.x+p.w/2,p.y+p.h);ctx.rotate(lean);ctx.translate(-(p.x+p.w/2),-(p.y+p.h));
  ctx.drawImage(tex,p.x+p.w/2-w/2,p.y+p.h-h+bounce,w,h);
  ctx.restore();
  return true;
}

function tri(g,cx,by,w,h){
